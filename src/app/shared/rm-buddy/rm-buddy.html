<!-- ================= HERO ================= -->

<div
  class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 p-8 text-white shadow-2xl">

  <!-- Background -->

  <div class="absolute left-10 top-8 animate-pulse text-5xl opacity-10">
    🤖
  </div>

  <div class="absolute right-10 top-10 animate-bounce text-5xl opacity-10">
    ✨
  </div>

  <div class="absolute bottom-8 left-1/3 animate-pulse text-4xl opacity-10">
    📚
  </div>

  <div class="absolute bottom-10 right-20 animate-bounce text-4xl opacity-10">
    🚀
  </div>

  <div
    class="relative z-10 flex flex-col gap-10 lg:flex-row lg:justify-between">

    <!-- ================= LEFT ================= -->

    <div class="max-w-2xl">

      <!-- Greeting -->

      <div
        class="inline-flex items-center gap-2 rounded-full bg-white/20 px-5 py-2 backdrop-blur">

        👋

        <span class="font-semibold">

          {{ greeting }}

        </span>

      </div>

      <!-- Name -->

      <h1 class="mt-5 text-5xl font-extrabold">

        Welcome Back,

        <span class="text-yellow-300">

          {{ student.fullName }}

        </span>

      </h1>

      <p class="mt-3 text-xl text-blue-100">

        Class {{ student.standard }}

        •

        {{ student.course }}

      </p>

      <!-- ================= RM BUDDY ================= -->

      <div
        class="mt-10 rounded-3xl bg-white/95 p-6 text-slate-800 shadow-2xl">

        <!-- Header -->

        <div class="flex items-center justify-between">

          <div class="flex items-center gap-3">

            <!-- Avatar -->

            <div
              class="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-r from-blue-500 to-purple-600 text-3xl text-white shadow-lg">

              {{ avatar }}

            </div>

            <div>

              <h3 class="font-bold text-blue-700">

                Vriksh AI

              </h3>

              <div
                class="flex items-center gap-2 text-sm text-green-600">

                <span
                  class="h-2 w-2 animate-pulse rounded-full bg-green-500">

                </span>

                Online

              </div>

            </div>

          </div>

          <div
            class="rounded-full bg-blue-100 px-4 py-1 text-xs font-bold text-blue-700">

            AI Assistant

          </div>

        </div>

        <!-- Message -->

        <div
          class="mt-6 rounded-2xl bg-blue-50 p-5 shadow-inner">

          <p
            class="text-lg leading-8">

            {{ buddy.message }}

          </p>

        </div>

        <!-- Typing -->

        <div
          class="mt-4 flex items-center gap-2 text-sm text-slate-500">

          <span>Typing</span>

          <span class="animate-bounce">•</span>

          <span
            class="animate-bounce"
            style="animation-delay:.2s">

            •

          </span>

          <span
            class="animate-bounce"
            style="animation-delay:.4s">

            •

          </span>

        </div>

      </div>

      <!-- Goal -->

      <div
        class="mt-8 rounded-2xl bg-white/10 p-6 backdrop-blur">

        <p class="text-blue-100">

          🎯 Today's Goal

        </p>

        <h3 class="mt-2 text-2xl font-bold">

          {{ todaysClass?.topic }}

        </h3>

      </div>

      <!-- Buttons -->

      <div class="mt-8 flex flex-wrap gap-4">

        <a

          [href]="todaysClass?.meetLink"

          target="_blank"

          class="rounded-xl bg-white px-6 py-3 font-bold text-blue-700 duration-300 hover:scale-105">

          🎥 Join Class

        </a>

        <button
          class="rounded-xl border border-white px-6 py-3 font-semibold duration-300 hover:bg-white/10">

          📚 Homework

        </button>

      </div>

    </div>

    <!-- ================= RIGHT ================= -->

    <div
      class="flex flex-col items-center justify-center">

      <div
        class="absolute h-72 w-72 animate-pulse rounded-full bg-white/20 blur-3xl">

      </div>

      <div
        class="relative flex h-64 w-64 items-center justify-center rounded-full border-4 border-white/30 bg-white shadow-2xl">

        <div
          class="animate-bounce text-[120px]">

          {{ avatar }}

        </div>

      </div>

      <div
        class="mt-8 rounded-full bg-green-500 px-8 py-3 font-bold shadow-lg">

        🟢 Ready to Help

      </div>

      <div
        class="mt-4 rounded-full bg-white/20 px-5 py-2 backdrop-blur">

        💬 Always Online

      </div>

    </div>

  </div>

</div>
