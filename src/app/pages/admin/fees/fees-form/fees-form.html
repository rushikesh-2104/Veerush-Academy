<!-- Background -->

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">

  <!-- Modal -->

  <div class="w-full max-w-2xl rounded-3xl bg-white shadow-2xl">

    <!-- Header -->

    <div class="flex items-center justify-between border-b p-6">

      <div>

        <h2 class="text-2xl font-bold text-slate-800">
          💰 Add Student Fees
        </h2>

        <p class="mt-1 text-sm text-slate-500">
          Create a new fee record.
        </p>

      </div>

      <button
        (click)="close.emit()"
        class="rounded-xl p-2 hover:bg-slate-100">

        <i class="fa-solid fa-xmark text-2xl"></i>

      </button>

    </div>

    <!-- Form -->

    <form
      [formGroup]="feeForm"
      (ngSubmit)="saveFee()"
      class="space-y-6 p-6">

      <!-- Student -->

      <div>

        <label class="mb-2 block font-medium">

          Student

        </label>

        <select
          formControlName="student"
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3">

          <option value="">
            Select Student
          </option>

          <option
            *ngFor="let student of students"
            [value]="student._id">

            {{ student.fullName }}

          </option>

        </select>

      </div>


      <div>
  <label class="mb-2 block font-medium">
    Course
  </label>

  <input
    type="text"
    formControlName="course"
    placeholder="Olympiad CS"
    class="w-full rounded-xl border border-slate-300 px-4 py-3">
</div>

      <!-- Total Fees -->

      <div>

        <label class="mb-2 block font-medium">

          Total Fees

        </label>

        <input
          type="number"
          formControlName="totalFees"
          placeholder="25000"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <!-- Installment + Due Date -->

      <div class="grid gap-5 md:grid-cols-2">

        <div>

          <label class="mb-2 block font-medium">

            Installments

          </label>

          <select
            formControlName="totalInstallments"
            class="w-full rounded-xl border border-slate-300 px-4 py-3">

            <option [value]="1">1</option>
            <option [value]="2">2</option>
            <option [value]="3">3</option>
            <option [value]="4">4</option>
            <option [value]="5">5</option>
            <option [value]="6">6</option>

          </select>

        </div>

        <div>

          <label class="mb-2 block font-medium">

            Monthly Due Date

          </label>

          <select
            formControlName="dueDay"
            class="w-full rounded-xl border border-slate-300 px-4 py-3">

            <option [value]="5">5</option>
            <option [value]="10">10</option>
            <option [value]="15">15</option>
            <option [value]="20">20</option>
            <option [value]="25">25</option>

          </select>

        </div>

      </div>

      <!-- Summary -->

      <div class="rounded-2xl bg-blue-50 p-5">

        <h3 class="font-bold text-blue-700">

          📌 Summary

        </h3>

        <div class="mt-3 space-y-2 text-sm text-slate-700">

          <p>

            Total Fees :
            <span class="font-semibold">
              ₹ {{ feeForm.value.totalFees || 0 }}
            </span>

          </p>

          <p>

            Installments :
            <span class="font-semibold">
              {{ feeForm.value.totalInstallments }}
            </span>

          </p>

          <p>

            Per Installment :
            <span class="font-semibold text-green-600">

              ₹
              {{
                feeForm.value.totalFees
                  ? (feeForm.value.totalFees /
                      feeForm.value.totalInstallments)
                  : 0
              }}

            </span>

          </p>

        </div>

      </div>

      <!-- Footer -->

      <div
        class="flex flex-col-reverse gap-3 border-t pt-6 sm:flex-row sm:justify-end">

        <button
          type="button"
          (click)="close.emit()"
          class="rounded-xl border border-slate-300 px-6 py-3 font-semibold hover:bg-slate-100">

          Cancel

        </button>

        <button
          type="submit"
          class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700">

          💾 Save Fees

        </button>

      </div>

    </form>

  </div>

</div>
