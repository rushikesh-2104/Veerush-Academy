<form
  [formGroup]="admissionForm"
  (ngSubmit)="registerStudent()"
  class="space-y-8"
>

<!-- ========================= -->
<!-- Personal Details -->
<!-- ========================= -->

<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

  <h3 class="mb-6 flex items-center gap-2 text-xl font-bold text-blue-600">
    <i class="fa-solid fa-user"></i>
    Personal Details
  </h3>

  <div class="grid gap-5 md:grid-cols-2">

    <div class="md:col-span-2">
      <label class="mb-2 block font-medium">Full Name *</label>

      <input
        type="text"
        formControlName="fullName"
        placeholder="Enter Student Name"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">
    </div>

    <div>
      <label class="mb-2 block font-medium">Father Name</label>

      <input
        type="text"
        formControlName="fatherName"
        placeholder="Father Name"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">
    </div>

    <div>
      <label class="mb-2 block font-medium">Mother Name</label>

      <input
        type="text"
        formControlName="motherName"
        placeholder="Mother Name"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">
    </div>

    <div>

      <label class="mb-2 block font-medium">Gender *</label>

      <select
        formControlName="gender"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>

      </select>

    </div>

    <div>

      <label class="mb-2 block font-medium">Date of Birth *</label>

      <input
        type="date"
        formControlName="dob"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

  </div>

</section>

<!-- ========================= -->
<!-- Contact Details -->
<!-- ========================= -->

<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

  <h3 class="mb-6 flex items-center gap-2 text-xl font-bold text-green-600">
    <i class="fa-solid fa-phone"></i>
    Contact Details
  </h3>

  <div class="grid gap-5 md:grid-cols-2">

    <div>

      <label class="mb-2 block font-medium">Student Phone *</label>

      <input
        type="text"
        formControlName="phone"
        placeholder="9876543210"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <div>

      <label class="mb-2 block font-medium">Parent Phone</label>

      <input
        type="text"
        formControlName="parentPhone"
        placeholder="9876543210"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    

    <div class="md:col-span-2">

      <label class="mb-2 block font-medium">Address</label>

      <textarea
        rows="3"
        formControlName="address"
        placeholder="Enter Address"
        class="w-full rounded-xl border border-slate-300 p-4"></textarea>

    </div>

  </div>

</section>

<!-- ========================= -->
<!-- Academic Details -->
<!-- ========================= -->

<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

  <h3 class="mb-6 flex items-center gap-2 text-xl font-bold text-purple-600">
    <i class="fa-solid fa-school"></i>
    Academic Details
  </h3>

  <div class="grid gap-5 md:grid-cols-2">

    <div class="md:col-span-2">

      <label class="mb-2 block font-medium">School</label>

      <input
        type="text"
        formControlName="school"
        placeholder="School Name"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <div>

      <label class="mb-2 block font-medium">Standard *</label>

      <input
        type="text"
        formControlName="standard"
        placeholder="9th"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <div>

      <label class="mb-2 block font-medium">Board</label>

      <select
        formControlName="board"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

        <option value="SSC">SSC</option>
        <option value="CBSE">CBSE</option>
        <option value="ICSE">ICSE</option>
        <option value="State">State</option>
        <option value="Other">Other</option>

      </select>

    </div>

    <div>

      <label class="mb-2 block font-medium">Course</label>

      <input
        type="text"
        formControlName="course"
        placeholder="Olympiad"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <div>

      <label class="mb-2 block font-medium">Batch</label>

      <input
        type="text"
        formControlName="batch"
        placeholder="Evening Batch"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <div>

      <label class="mb-2 block font-medium">Joining Date</label>

      <input
        type="date"
        formControlName="joiningDate"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

  </div>

</section>

<!-- ========================= -->
<!-- Fee Details -->
<!-- ========================= -->

<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

  <h3 class="mb-6 flex items-center gap-2 text-xl font-bold text-amber-600">
    <i class="fa-solid fa-money-bill-wave"></i>
    Fee Details
  </h3>

  <div class="grid gap-5 md:grid-cols-2">

    <div>

      <label class="mb-2 block font-medium">Admission Fees</label>

      <input
        type="number"
        formControlName="admissionFees"
        placeholder="0"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <div>

      <label class="mb-2 block font-medium">Monthly Fees</label>

      <input
        type="number"
        formControlName="monthlyFees"
        placeholder="0"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

  </div>

</section>

<!-- ========================= -->
<!-- Login Credentials -->
<!-- ========================= -->

<!-- ========================= -->
<!-- Login Credentials -->
<!-- ========================= -->

<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

  <h3 class="mb-6 flex items-center gap-2 text-xl font-bold text-red-600">
    <i class="fa-solid fa-lock"></i>
    Login Credentials
  </h3>

  <div class="grid gap-5 md:grid-cols-2">

    <!-- Login Email -->
    <div>

      <label class="mb-2 block font-medium">
        Login Email *
      </label>

      <input
        type="email"
        formControlName="email"
        placeholder="student@email.com"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

    <!-- Password -->
    <div>

      <label class="mb-2 block font-medium">
        Password *
      </label>

      <input
        type="password"
        formControlName="password"
        placeholder="Minimum 6 Characters"
        class="w-full rounded-xl border border-slate-300 px-4 py-3">

    </div>

  </div>

</section>

<!-- ========================= -->
<!-- Footer -->
<!-- ========================= -->

<div class="flex justify-end gap-4">

  <button
    type="button"
    (click)="admissionForm.reset()"
    class="rounded-xl border border-slate-300 px-8 py-3 font-semibold hover:bg-slate-100">

    Cancel

  </button>

  <button
    type="submit"
    [disabled]="admissionForm.invalid"
    class="rounded-xl bg-blue-600 px-8 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-400">

    <i class="fa-solid fa-user-plus mr-2"></i>
    Register Student

  </button>

</div>

</form>
