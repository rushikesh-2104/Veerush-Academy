<div class="space-y-8 p-6">

  <!-- Header -->

  <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">

    <div>

      <h1 class="text-3xl font-bold text-slate-800">

        📚 Homework

      </h1>

      <p class="mt-2 text-slate-500">

        Manage homework assignments for all students.

      </p>

    </div>

    <button
      (click)="openHomeworkModal()"
      class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white transition duration-300 hover:bg-blue-700">

      <i class="fa-solid fa-plus mr-2"></i>

      Add Homework

    </button>

  </div>

  <!-- Search -->

  <div class="relative">

    <i
      class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
    </i>

    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search homework..."
      class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-12 pr-4 outline-none transition focus:border-blue-500">

  </div>

  <!-- Homework List -->

  <div class="grid gap-5">

    <div
      *ngFor="let hw of filteredHomework"
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-lg">

      <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">

        <!-- Left -->

        <div class="flex gap-5">

          <div
            class="flex h-14 w-14 items-center justify-center rounded-full bg-blue-100 text-xl text-blue-600">

            <i class="fa-solid fa-book"></i>

          </div>

          <div>

            <h2 class="text-xl font-bold text-slate-800">

              {{ hw.title }}

            </h2>

            <div class="mt-3 flex flex-wrap gap-4 text-sm text-slate-500">

              <span>

                👨‍🎓 {{ hw.studentId.fullName  }}

              </span>

              <span>

                📚 {{ hw.subject }}

              </span>

              <span>

                📅 {{ hw.dueDate }}

              </span>

            </div>

          </div>

        </div>

        <!-- Right -->

        <div class="flex flex-col items-start gap-4 lg:items-end">

          <span
            class="rounded-full px-4 py-2 text-sm font-semibold"
            [ngClass]="{
              'bg-orange-100 text-orange-700': hw.status === 'Pending',
              'bg-green-100 text-green-700': hw.status === 'Completed'
            }">

            {{ hw.status }}

          </span>

          <div class="flex gap-3">

            <button  (click)="editHomework(hw)"
              class="rounded-xl bg-yellow-100 px-4 py-2 text-yellow-700 transition hover:bg-yellow-200">

              <i class="fa-solid fa-pen-to-square mr-2"></i>

              Edit

            </button>

            <button  (click)="deleteHomework(hw._id!)"
              class="rounded-xl bg-red-100 px-4 py-2 text-red-600 transition hover:bg-red-200">

              <i class="fa-solid fa-trash mr-2"></i>

              Delete

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Empty State -->

  <div
    *ngIf="filteredHomework.length === 0"
    class="rounded-2xl bg-white p-12 text-center shadow-sm">

    <i class="fa-solid fa-book-open text-5xl text-slate-300"></i>

    <h2 class="mt-5 text-2xl font-bold text-slate-700">

      No Homework Found

    </h2>

    <p class="mt-2 text-slate-500">

      Try searching with another keyword.

    </p>

  </div>

</div>

<!-- Add Homework Modal -->

<app-homework-form
  *ngIf="showHomeworkModal"
  [homework]="selectedHomework"
  (close)="closeHomeworkModal()">
</app-homework-form>
