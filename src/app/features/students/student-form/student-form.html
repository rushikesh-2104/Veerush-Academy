<!-- Header -->

<div class="sticky top-0 flex items-center justify-between border-b bg-white p-6">

  <div>

    <h2 class="text-2xl font-bold text-slate-800">
      👨‍🎓 Add New Student
    </h2>

    <p class="mt-1 text-sm text-slate-500">
      Register a new student into the Tuition Management System.
    </p>

  </div>

  <button
    type="button"
    (click)="close.emit()"
    class="rounded-xl p-2 hover:bg-slate-100">

    <i class="fa-solid fa-xmark text-2xl"></i>

  </button>

</div>

<form
  [formGroup]="studentForm"
  (ngSubmit)="saveStudent()"
  class="space-y-8 p-6">

  <!-- ============================= -->
  <!-- Personal Details -->
  <!-- ============================= -->

  <section>

    <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-blue-600">

      <i class="fa-solid fa-user"></i>

      Personal Details

    </h3>

    <div class="grid gap-5 md:grid-cols-2">

      <div class="md:col-span-2">

        <label class="mb-2 block font-medium">
          Full Name *
        </label>

        <input
          type="text"
          formControlName="fullName"
          placeholder="Enter Student Name"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Father Name
        </label>

        <input
          type="text"
          formControlName="fatherName"
          placeholder="Father Name"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Mother Name
        </label>

        <input
          type="text"
          formControlName="motherName"
          placeholder="Mother Name"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Gender
        </label>

        <select
          formControlName="gender"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

          <option value="Male">Male</option>

          <option value="Female">Female</option>

          <option value="Other">Other</option>

        </select>

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Date of Birth
        </label>

        <input
          type="date"
          formControlName="dob"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

    </div>

  </section>

  <!-- ============================= -->
  <!-- Contact Details -->
  <!-- ============================= -->

  <section>

    <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-blue-600">

      <i class="fa-solid fa-phone"></i>

      Contact Details

    </h3>

    <div class="grid gap-5 md:grid-cols-2">

      <div>

        <label class="mb-2 block font-medium">
          Student Mobile *
        </label>

        <input
          type="text"
          formControlName="phone"
          placeholder="9876543210"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Parent Mobile
        </label>

        <input
          type="text"
          formControlName="parentPhone"
          placeholder="9876543210"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div class="md:col-span-2">

        <label class="mb-2 block font-medium">
          Email *
        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="student@email.com"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div class="md:col-span-2">

        <label class="mb-2 block font-medium">
          Address
        </label>

        <textarea
          rows="3"
          formControlName="address"
          class="w-full rounded-xl border border-slate-300 p-4"></textarea>

      </div>

    </div>

  </section>

  <!-- ============================= -->
  <!-- Academic Details -->
  <!-- ============================= -->

  <section>

    <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-blue-600">

      <i class="fa-solid fa-book"></i>

      Academic Details

    </h3>

    <div class="grid gap-5 md:grid-cols-2">

      <div>

        <label class="mb-2 block font-medium">
          School
        </label>

        <input
          type="text"
          formControlName="school"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Standard *
        </label>

        <input
          type="text"
          formControlName="standard"
          placeholder="5th"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Board
        </label>

        <select
          formControlName="board"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

          <option>SSC</option>
          <option>CBSE</option>
          <option>ICSE</option>
          <option>State</option>
          <option>Other</option>

        </select>

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Course
        </label>

        <input
          type="text"
          formControlName="course"
          placeholder="Olympiad Maths"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>


            <div>

        <label class="mb-2 block font-medium">
          Batch
        </label>

        <input
          type="text"
          formControlName="batch"
          placeholder="Evening Batch"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Joining Date
        </label>

        <input
          type="date"
          formControlName="joiningDate"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

    </div>

  </section>

  <!-- ============================= -->
  <!-- Fees Details -->
  <!-- ============================= -->

  <section>

    <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-blue-600">

      <i class="fa-solid fa-indian-rupee-sign"></i>

      Fees Details

    </h3>

    <div class="grid gap-5 md:grid-cols-2">

      <div>

        <label class="mb-2 block font-medium">
          Admission Fees
        </label>

        <input
          type="number"
          formControlName="admissionFees"
          placeholder="500"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Monthly Fees
        </label>

        <input
          type="number"
          formControlName="monthlyFees"
          placeholder="2500"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

    </div>

  </section>

  <!-- ============================= -->
  <!-- Login Credentials -->
  <!-- ============================= -->

  <section>

    <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-blue-600">

      <i class="fa-solid fa-lock"></i>

      Login Credentials

    </h3>

    <div class="grid gap-5 md:grid-cols-2">

      <div>

        <label class="mb-2 block font-medium">
          Email
        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="student@email.com"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter Password"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Role
        </label>

        <select
          formControlName="role"
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

          <option value="student">
            Student
          </option>

        </select>

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Profile Image URL
        </label>

        <input
          type="text"
          formControlName="profileImage"
          placeholder="https://..."
          class="w-full rounded-xl border border-slate-300 px-4 py-3">

      </div>

    </div>

  </section>


    <!-- ============================= -->
  <!-- Footer -->
  <!-- ============================= -->

  <div
    class="flex flex-col-reverse gap-3 border-t pt-6 sm:flex-row sm:justify-end">

    <button
      type="button"
      (click)="close.emit()"
      class="rounded-xl border border-slate-300 px-6 py-3 font-semibold transition hover:bg-slate-100">

      Cancel

    </button>

    <button
      type="submit"
      [disabled]="studentForm.invalid"
      class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-400">

      <i class="fa-solid fa-user-plus mr-2"></i>

      Register Student

    </button>

  </div>

</form>
